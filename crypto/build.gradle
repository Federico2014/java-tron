plugins {
    id 'java'
}

version '1.0.0'

sourceCompatibility = 1.8

repositories {
    mavenCentral()
}

dependencies {
    api project(":common")
    api 'net.java.dev.jna:jna:5.12.1'
    api 'com.github.federico2014.besu-native:gnark:1.3.9'
    api 'com.github.federico2014.besu-native:secp256k1:1.3.9'
    api 'com.github.federico2014.besu-native:blake2bf:1.3.9'
    api 'com.github.federico2014.besu-native:arithmetic:1.3.9'
    api 'com.github.federico2014.besu-native:secp256r1:1.3.9'
}

jacocoTestReport {
    reports {
        xml.enabled = true
        html.enabled = true
    }
    getExecutionData().setFrom(fileTree('../framework/build/jacoco').include("**.exec"))
    afterEvaluate {
        classDirectories.from = classDirectories.files.collect {
            fileTree(dir: it,)
        }
    }
}
